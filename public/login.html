<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Supernatural | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/estilo.css">
    <link rel="icon" href="./assets/icon/favicon2.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com">
</head>

<body class="auth-page">

    <div class="header">
        <div class="container">
            <img src="assets/imgs/Supernatural_logo_maroon.png" alt="Logo Supernatural">
            <ul class="navbar">
                <li>
                    <a href="index.html">INÍCIO</a>
                </li>
                <li>
                    <a href="personagens.html">PERSONAGENS</a>
                </li>
                <li>
                    <a href="monstros.html">MONSTROS</a>
                </li>
                <li>|</li>
                <li class="agora">
                    <a href="#">LOGIN</a>
                </li>
                <li>
                    <a href="cadastro.html">CADASTRO</a>
                </li>
            </ul>
        </div>
    </div>

    <main class="auth-section">
        <div class="container">
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>

            <section class="auth-card">
                <h2>Entrar no fandom</h2>
                <p>Acesse sua conta para ver o dashboard e continuar sua jornada em Supernatural.</p>

                <div class="formulario auth-formulario">
                    <div class="campo">
                        <span>E-mail</span>
                        <input id="email_input" type="email" placeholder="seuemail@provedor.com">
                    </div>

                    <div class="campo">
                        <span>Senha</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>

                    <button class="botao" onclick="entrar()">Entrar</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando">
                </div>

                <div id="div_erros_login"></div>

                <span class="auth-auxiliar">Ainda não tem conta? <a href="cadastro.html">Criar cadastro</a></span>
            </section>
        </div>
    </main>

    <div class="footer">
        <div class="container">
            <h4>Projeto acadêmico • Supernatural Fan Site • SPTech &copy; 2026</h4>
        </div>
    </div>

</body>

</html>

<script>
    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Preencha e-mail e senha para continuar.";
            finalizarAguardar();
            return false;
        }

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            if (resposta.ok) {
                resposta.json().then(json => {
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        window.location = "./dashboard/aquarios.html";
                    }, 1000);
                });
            } else {
                resposta.text().then(texto => {
                    cardErro.style.display = "block";
                    mensagem_erro.innerHTML = texto || "Não foi possível entrar.";
                    finalizarAguardar(texto);
                });
            }
        }).catch(function (erro) {
            console.log(erro);
            cardErro.style.display = "block";
            mensagem_erro.innerHTML = "Erro ao tentar fazer login.";
            finalizarAguardar();
        });

        return false;
    }
</script>
