<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../css/estilo.css">
    <link rel="stylesheet" href="../css/dashboard-supernatural.css">

    <!-- <script src="../js/sessao.js"></script> -->
    <script src="../js/dashboard-supernatural.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body onload="inicializarDashboard()">

    <div class="header">
        <div class="container">
            <img src="../assets/imgs/Supernatural_logo_maroon.png">
            <ul class="navbar">
                <li class="agora">
                    <a href="#">INÍCIO</a>
                </li>
                <li>
                    <a href="../personagens.html">PERSONAGENS</a>
                </li>
                <li>
                    <a href="../monstros.html">MONSTROS</a>
                </li>
                <li>|</li>
                <li>
                    <a href="../login.html">LOGIN</a>
                </li>
                <li>
                    <a href="../cadastro.html">CADASTRO</a>
                </li>
            </ul>
        </div>
    </div>

    <main class="dashboard-container">

        <section class="dashboard-boas-vindas">
            <h1>Bem-vindo, <span id="nomeUsuario"></span></h1>
            <p>Seu perfil de caçador.</p>
        </section>

        <!-- PREFERÊNCIAS PESSOAIS -->

        <section class="preferencias">

            <h2>Suas escolhas</h2>

            <div class="preferencias-grid">

                <div id="personagemFavorito"></div>

                <div id="monstroTemido"></div>

            </div>

        </section>

        <!-- KPIs DA COMUNIDADE -->

        <section class="indicadores">

            <h2>Preferências da comunidade</h2>

            <div class="indicadores-grid">

                <div id="kpiPersonagem"></div>

                <div id="kpiMonstro"></div>

            </div>

        </section>

        <!-- GRÁFICOS -->

        <section class="graficos">

            <h2>Ranking da comunidade</h2>

            <div class="graficos-grid">

                <div class="grafico-card">

                    <h3>Personagens favoritos</h3>

                    <canvas id="graficoPersonagens"></canvas>

                </div>

                <div class="grafico-card">

                    <h3>Monstros mais temidos</h3>

                    <canvas id="graficoMonstros"></canvas>

                </div>

            </div>

        </section>

    </main>

    <div class="footer">
        <div class="container">
            <h4>Projeto acadêmico • Supernatural Fan Site • SPTech &copy; 2026</h4>
        </div>
    </div>

</body>

</html>
