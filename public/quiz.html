<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supernatural | Quiz</title>

  <script src="./js/sessao.js"></script>
  <script src="./js/quiz.js" defer></script>

  <link rel="stylesheet" href="./css/estilo.css" />
  <link rel="icon" href="./assets/icon/favicon2.ico" />
</head>

<body class="auth-page" onload="inicializarQuiz()">
  <div class="header">
    <div class="container">
      <img src="assets/imgs/Supernatural_logo_maroon.png" alt="Logo Supernatural" />
      <ul class="navbar">
        <li><a href="index.html">INÍCIO</a></li>
        <li><a href="personagens.html">PERSONAGENS</a></li>
        <li><a href="monstros.html">MONSTROS</a></li>
        <li class="agora"><a href="#">QUIZ</a></li>
        <li>|</li>
        <li><a href="dashboard.html">DASHBOARD</a></li>
      </ul>
    </div>
  </div>

  <main class="auth-section">
    <div class="container">
      <section class="auth-card auth-card-quiz">
        <h2>Quiz de Monstros</h2>
        <p>Responda as 10 perguntas e registre sua pontuação. A dashboard sempre considera sua maior pontuação.</p>

        <form id="quizForm" class="auth-formulario">
          <div id="perguntasContainer"></div>

          <button type="submit" class="botao">Enviar respostas</button>
        </form>

        <p id="resultadoQuiz" class="quiz-resultado" aria-live="polite"></p>
      </section>
    </div>
  </main>

  <div class="footer">
    <div class="container">
      <h4>Projeto acadêmico • Supernatural Fan Site • SPTech &copy; 2026</h4>
    </div>
  </div>
